<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocMind — RAG Q&A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0d0d0d;
      --paper:     #f5f0e8;
      --cream:     #ede8dc;
      --warm:      #d4c9b0;
      --accent:    #c1440e;
      --accent2:   #2a5c45;
      --muted:     #7a7265;
      --border:    #c8bfac;
      --card:      #faf7f2;
      --shadow:    rgba(13,13,13,0.08);
    }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 36px;
      border-bottom: 1.5px solid var(--border);
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-word {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      letter-spacing: -0.5px;
      color: var(--ink);
    }

    .logo-tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      background: rgba(193,68,14,0.08);
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--warm);
      transition: background 0.3s;
    }

    .status-dot.ready { background: #4caf79; }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1.5px solid var(--border);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      background: var(--card);
      overflow-y: auto;
    }

    .sidebar-section h3 {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Upload zone */
    .upload-zone {
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--paper);
      position: relative;
    }

    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(193,68,14,0.04);
    }

    .upload-zone input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }

    .upload-icon {
      width: 36px; height: 36px;
      margin: 0 auto 10px;
      opacity: 0.4;
    }

    .upload-zone p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .upload-zone strong {
      color: var(--accent);
      font-weight: 500;
    }

    .upload-types {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--warm);
      margin-top: 6px;
    }

    /* Upload progress */
    .upload-progress {
      display: none;
      margin-top: 12px;
    }

    .progress-bar-wrap {
      height: 3px;
      background: var(--cream);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 2px;
    }

    .progress-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'DM Mono', monospace;
    }

    /* Doc list */
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--paper);
      border: 1px solid var(--border);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .doc-icon {
      width: 28px; height: 28px;
      background: rgba(193,68,14,0.1);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .doc-icon svg { width: 14px; height: 14px; color: var(--accent); }

    .doc-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .doc-chunks {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .empty-docs {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      padding: 8px 0;
    }

    /* Reset */
    .btn-reset {
      width: 100%;
      padding: 9px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      border-color: #c0392b;
      color: #c0392b;
      background: rgba(192,57,43,0.04);
    }

    /* ── Main chat area ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.5;
      user-select: none;
    }

    .empty-state-glyph {
      font-family: 'DM Serif Display', serif;
      font-size: 72px;
      color: var(--warm);
      line-height: 1;
    }

    .empty-state p {
      font-size: 15px;
      color: var(--muted);
      text-align: center;
      max-width: 300px;
      line-height: 1.7;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 14px;
      max-width: 780px;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.user .msg-avatar {
      background: var(--ink);
      color: var(--paper);
    }

    .message.assistant .msg-avatar {
      background: var(--accent);
      color: white;
    }

    .msg-body { display: flex; flex-direction: column; gap: 8px; }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14.5px;
      line-height: 1.75;
    }

    .message.user .msg-bubble {
      background: var(--ink);
      color: var(--paper);
      border-top-right-radius: 3px;
    }

    .message.assistant .msg-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-top-left-radius: 3px;
      color: var(--ink);
    }

    /* Sources accordion */
    .sources-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 0;
      text-align: left;
      transition: color 0.2s;
    }

    .sources-toggle:hover { color: var(--accent2); }

    .sources-toggle svg {
      width: 12px; height: 12px;
      transition: transform 0.2s;
    }

    .sources-toggle.open svg { transform: rotate(90deg); }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .sources-list.open { display: flex; }

    .source-card {
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 3px solid var(--accent2);
      background: rgba(42,92,69,0.05);
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    .source-card .source-file {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--accent2);
      font-weight: 500;
      margin-bottom: 4px;
    }

    /* Thinking indicator */
    .thinking {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0;
    }

    .thinking-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Input bar ── */
    .input-bar {
      padding: 20px 40px 24px;
      border-top: 1.5px solid var(--border);
      background: var(--paper);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px 10px 18px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: var(--accent); }

    textarea {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      color: var(--ink);
      resize: none;
      line-height: 1.6;
      max-height: 120px;
      outline: none;
    }

    textarea::placeholder { color: var(--warm); }

    .btn-send {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--ink);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-send:hover { background: var(--accent); }
    .btn-send:active { transform: scale(0.93); }
    .btn-send:disabled { background: var(--warm); cursor: not-allowed; }
    .btn-send svg { width: 16px; height: 16px; color: white; }

    .input-hint {
      font-size: 11px;
      color: var(--warm);
      margin-top: 8px;
      text-align: right;
      font-family: 'DM Mono', monospace;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--paper);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error { background: #c0392b; }
    .toast.success { background: var(--accent2); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="logo">
      <span class="logo-word">DocMind</span>
      <span class="logo-tag">RAG</span>
    </div>
    <div class="header-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">No documents loaded</span>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Upload -->
    <div class="sidebar-section">
      <h3>Upload Documents</h3>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.txt,.md" multiple />
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 4v12M8 8l4-4 4 4"/>
        </svg>
        <p><strong>Drop files here</strong> or click to browse</p>
        <p class="upload-types">PDF · TXT · MD</p>
      </div>
      <div class="upload-progress" id="uploadProgress">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <p class="progress-label" id="progressLabel">Indexing…</p>
      </div>
    </div>

    <!-- Documents -->
    <div class="sidebar-section">
      <h3>Indexed Documents</h3>
      <div class="doc-list" id="docList">
        <p class="empty-docs">No documents yet.</p>
      </div>
    </div>

    <!-- Reset -->
    <div class="sidebar-section" style="margin-top:auto">
      <button class="btn-reset" onclick="resetIndex()">Clear all documents</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="chat-window" id="chatWindow">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-glyph">∂</div>
        <p>Upload a document, then ask anything about its contents.</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea
          id="queryInput"
          rows="1"
          placeholder="Ask a question about your documents…"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendQuery()" title="Send (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Enter to send · Shift+Enter for new line</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';  // same origin

  // ── State ──────────────────────────────────────────────────────────────────
  let docs = [];

  // ── Toast ──────────────────────────────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.className = 'toast', 3000);
  }

  // ── Status ─────────────────────────────────────────────────────────────────
  async function refreshStatus() {
    try {
      const res = await fetch(`${API}/status`);
      const data = await res.json();
      const dot  = document.getElementById('statusDot');
      const txt  = document.getElementById('statusText');
      if (data.ready) {
        dot.classList.add('ready');
        txt.textContent = `${data.documents.length} doc${data.documents.length !== 1 ? 's' : ''} · ${data.total_chunks} chunks`;
      } else {
        dot.classList.remove('ready');
        txt.textContent = 'No documents loaded';
      }
    } catch {}
  }

  // ── Upload ─────────────────────────────────────────────────────────────────
  const uploadZone = document.getElementById('uploadZone');
  const fileInput  = document.getElementById('fileInput');

  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  async function handleFiles(fileList) {
    for (const file of fileList) {
      await uploadFile(file);
    }
  }

  async function uploadFile(file) {
    const progress = document.getElementById('uploadProgress');
    const fill     = document.getElementById('progressFill');
    const label    = document.getElementById('progressLabel');

    progress.style.display = 'block';
    label.textContent = `Indexing ${file.name}…`;
    fill.style.width = '30%';

    const form = new FormData();
    form.append('file', file);

    try {
      fill.style.width = '70%';
      const res  = await fetch(`${API}/upload`, { method: 'POST', body: form });
      const data = await res.json();

      fill.style.width = '100%';

      if (!res.ok) {
        showToast(data.detail || 'Upload failed', 'error');
      } else {
        showToast(`${file.name} indexed (${data.chunks_indexed} chunks)`, 'success');
        addDocToList(file.name, data.chunks_indexed);
        await refreshStatus();
        hideEmptyState();
      }
    } catch (err) {
      showToast('Upload error: ' + err.message, 'error');
    } finally {
      setTimeout(() => {
        progress.style.display = 'none';
        fill.style.width = '0%';
      }, 600);
    }
  }

  function addDocToList(name, chunks) {
    const list = document.getElementById('docList');
    const empty = list.querySelector('.empty-docs');
    if (empty) empty.remove();

    const item = document.createElement('div');
    item.className = 'doc-item';
    item.innerHTML = `
      <div class="doc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <span class="doc-name" title="${name}">${name}</span>
      <span class="doc-chunks">${chunks}c</span>
    `;
    list.appendChild(item);
  }

  // ── Chat ───────────────────────────────────────────────────────────────────
  function hideEmptyState() {
    const e = document.getElementById('emptyState');
    if (e) e.style.display = 'none';
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  }

  function appendMessage(role, content, sources = []) {
    const window = document.getElementById('chatWindow');
    const msg    = document.createElement('div');
    msg.className = `message ${role}`;

    const avatarLabel = role === 'user' ? 'U' : 'D';
    const sourcesHtml = sources.length ? `
      <button class="sources-toggle" onclick="toggleSources(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        ${sources.length} source${sources.length !== 1 ? 's' : ''} retrieved
      </button>
      <div class="sources-list">
        ${sources.map((s, i) => `
          <div class="source-card">
            <div class="source-file">Source ${i+1} — ${s.filename}</div>
            ${s.excerpt}
          </div>
        `).join('')}
      </div>
    ` : '';

    msg.innerHTML = `
      <div class="msg-avatar">${avatarLabel}</div>
      <div class="msg-body">
        <div class="msg-bubble">${escapeHtml(content)}</div>
        ${sourcesHtml}
      </div>
    `;

    window.appendChild(msg);
    window.scrollTop = window.scrollHeight;
    return msg;
  }

  function appendThinking() {
    const window = document.getElementById('chatWindow');
    const el     = document.createElement('div');
    el.className = 'thinking';
    el.innerHTML = `
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
      Thinking…
    `;
    window.appendChild(el);
    window.scrollTop = window.scrollHeight;
    return el;
  }

  function toggleSources(btn) {
    btn.classList.toggle('open');
    btn.nextElementSibling.classList.toggle('open');
  }

  async function sendQuery() {
    const input = document.getElementById('queryInput');
    const btn   = document.getElementById('sendBtn');
    const q     = input.value.trim();
    if (!q) return;

    hideEmptyState();
    appendMessage('user', q);
    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;

    const thinking = appendThinking();

    try {
      const res  = await fetch(`${API}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, top_k: 5 }),
      });
      const data = await res.json();
      thinking.remove();

      if (!res.ok) {
        appendMessage('assistant', data.detail || 'Something went wrong.');
      } else {
        appendMessage('assistant', data.answer, data.sources || []);
      }
    } catch (err) {
      thinking.remove();
      appendMessage('assistant', 'Network error: ' + err.message);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  // ── Reset ──────────────────────────────────────────────────────────────────
  async function resetIndex() {
    if (!confirm('Clear all documents and conversation?')) return;
    await fetch(`${API}/reset`, { method: 'DELETE' });

    document.getElementById('docList').innerHTML = '<p class="empty-docs">No documents yet.</p>';
    document.getElementById('chatWindow').innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="empty-state-glyph">∂</div>
        <p>Upload a document, then ask anything about its contents.</p>
      </div>
    `;
    refreshStatus();
    showToast('Index cleared.');
  }

  // ── Util ───────────────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  refreshStatus();
</script>
